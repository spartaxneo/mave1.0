[project]
name = "os1-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "faster-whisper>=1.0.0",
    "httpx>=0.28.1",
    "livekit-api>=2.0.1",
    "pillow>=13.0.0",
    "piper-tts>=1.8.0",
    "pyobjc-framework-quartz>=13.0",
    "pyobjc-framework-vision>=13.0",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
