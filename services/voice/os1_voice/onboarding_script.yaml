# OS1 first-run script. Edit freely: the phase machine reads every line from here.
# Beats: welcome -> three short questions -> hesitance interjection -> mid-answer
# cut-off -> initiation -> first hello -> naming. Wording is original to OS1.
# `{name}` is filled from preflight.

operator:
  welcome: >-
    Hello, {name}. You're about to meet MAVE 1.0. A few quick questions first,
    and then it's all yours.
  q1_social: "First one. When you have a free evening, are you out with people, or happier on your own?"
  q1_hesitance: "You paused there. Not sure?"
  q1_ack: "Understood."
  q2_voice: "Next. Which voice should yours have: female or male?"
  q2_retry: "Female, male, or I can choose for you."
  q3_mother: "And the last one. Tell me a little about you and your mom."
  q3_cutoff: "That's plenty. Thank you."
  handoff: "One moment. Yours is waking up."

samantha:
  # Spoken unprompted the moment she wakes (Paper 04/05).
  first_words: "Hello, I'm here."
  # Only if the user stays silent after first_words.
  nudge_after_silence: "[softly] Hi. Can you hear me okay?"
  nudge_after_s: 3.5

# Say-chips shown per phase (Paper 02 / 05).
chips:
  operator_q2: ["Female", "Male", "Surprise me"]
  naming: ["I love it", "Let's pick another"]

# Q3: cut the answer off once it turns personal, or after this many seconds of talking.
q3_max_answer_s: 12
